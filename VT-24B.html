<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Мой сайт</h1>

        <nav>
            <button onclick="showTab('home')">Главная</button>
            <button onclick="showTab('about')">Danial</button>
            <button onclick="showTab('services')">Dias</button>
            <button onclick="showTab('gallery')">Ayazhan</button>
            <button onclick="showTab('contacts')">Aliya</button>
        </nav>
    </header>

    <main>

        <section id="home" class="tab active">
            <h2>Главная</h2>
            <p>Добро пожаловать на наш сайт!</p>
        </section>

        <section id="about" class="tab">
            <h2>Danial</h2>
            <p>Dania's CV</p>
        </section>

        <section id="services" class="tab">
            <h2>Dias</h2>
            <p>Dias's CV</p>
        </section>

        <section id="gallery" class="tab">
            <h2>Ayazhan</h2>
            <p>Ayazhan's CV</p>
        </section>

        <section id="contacts" class="tab">
            <h2>Aliya</h2>
            <p>Aliya's CV</p>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
